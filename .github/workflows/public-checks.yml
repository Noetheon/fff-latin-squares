name: Public release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pdf-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated PDF-check dependencies
        run: python3 -m pip install pypdf==6.10.0 pypdfium2==5.13.0
      - run: >-
          python3 -B tools/check_paper_layout.py
          --pdf papers/FFF_Compact_Research_Dossier.pdf
          --output .audit/pdf-layout/compact.json
      - run: >-
          python3 -B tools/check_paper_layout.py
          --pdf papers/FFF_Long_Research_Dossier.pdf
          --output .audit/pdf-layout/long.json
      - run: python3 -B tools/check_pdf_metadata.py --output .audit/pdf-layout/metadata.json
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tools/verify_public_release.py
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B tools/check_theorem_records.py --output .audit/theorem-records
      - run: python3 -B tools/check_current_snapshot.py --output .audit/current-snapshot.json
  external-finite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -B tools/verify_public_release.py
      - run: >-
          python3 -B verification/audits/2026-09-28_dossier_hardened/scripts/reproduce_all.py
          --work-dir .audit/external-finite-audit
      - run: >-
          python3 -B manuscript/candidates/2026-09-30_research_review/scripts/audit_new_results.py
          --with-cpp
          --compare manuscript/candidates/2026-09-30_research_review/results/portable_audit.json
          --output .audit/binary-first-count.json
